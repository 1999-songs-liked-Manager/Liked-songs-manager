<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liked Songs Manager</title>
  <style>
    body{font-family:system-ui;background:#121212;color:white;margin:0;padding:20px}
    .wrap{max-width:900px;margin:auto}
    button{padding:12px 16px;margin:5px;border:0;border-radius:20px;font-weight:600}
    .green{background:#1ed760;color:#000}
    .red{background:#e44;color:white}
    input{padding:12px;width:90%;max-width:520px;border-radius:8px;border:1px solid #777}
    .song{padding:10px;border-bottom:1px solid #333;display:flex;gap:10px;align-items:center}
    .artist{color:#aaa;font-size:.9em}
    #status{margin:15px 0;color:#bbb}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🎵 Liked Songs Manager</h1>

  <div id="setup">
    <p>Spotify Client ID:</p>
    <input id="clientId" placeholder="Client ID hier einfügen">
    <br><br>
    <button class="green" onclick="login()">Mit Spotify verbinden</button>
  </div>

  <div id="app" hidden>
    <button onclick="selectAll()">Alle auswählen</button>
    <button onclick="clearSelection()">Auswahl aufheben</button>
    <button class="red" onclick="removeSelected()">Ausgewählte entfernen</button>
    <div id="status"></div>
    <div id="songs"></div>
  </div>
</div>

<script>
const redirectUri = location.origin + location.pathname;
const scopes = "user-library-read user-library-modify";
let token = "";
let tracks = [];

function randomString(n=64){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const a=new Uint32Array(n);
  crypto.getRandomValues(a);
  return Array.from(a,x=>chars[x%chars.length]).join("");
}

async function sha256(s){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
}

function base64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function login(){
  const clientId=document.getElementById("clientId").value.trim();
  if(!clientId) return alert("Bitte zuerst deine Client ID eintragen.");

  localStorage.setItem("spotify_client_id",clientId);

  const verifier=randomString();
  sessionStorage.setItem("pkce_verifier",verifier);
  const challenge=base64url(await sha256(verifier));

  const p=new URLSearchParams({
    client_id:clientId,
    response_type:"code",
    redirect_uri:redirectUri,
    scope:scopes,
    code_challenge_method:"S256",
    code_challenge:challenge
  });

  location.href="https://accounts.spotify.com/authorize?"+p;
}

async function exchangeCode(code){
  const clientId=localStorage.getItem("spotify_client_id");
  const verifier=sessionStorage.getItem("pkce_verifier");

  const body=new URLSearchParams({
    client_id:clientId,
    grant_type:"authorization_code",
    code,
    redirect_uri:redirectUri,
    code_verifier:verifier
  });

  const r=await fetch("https://accounts.spotify.com/api/token",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body
  });

  if(!r.ok) throw new Error("Spotify-Anmeldung fehlgeschlagen.");

  const data=await r.json();
  token=data.access_token;
  history.replaceState({},document.title,redirectUri);
  await loadSongs();
}

async function loadSongs(){
  document.getElementById("setup").hidden=true;
  document.getElementById("app").hidden=false;
  document.getElementById("status").textContent="Lieblingssongs werden geladen …";

  tracks=[];
  let url="https://api.spotify.com/v1/me/tracks?limit=50";

  while(url){
    const r=await fetch(url,{headers:{Authorization:"Bearer "+token}});
    if(!r.ok) throw new Error("Songs konnten nicht geladen werden.");
    const data=await r.json();

    for(const item of data.items){
      if(item.track) tracks.push(item.track);
    }
    url=data.next;
  }

  render();
}

function render(){
  document.getElementById("status").textContent =
    tracks.length+" Lieblingssongs geladen.";

  const box=document.getElementById("songs");
  box.innerHTML="";

  tracks.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="song";
    d.innerHTML=
      '<input type="checkbox" class="pick" data-i="'+i+'">'+
      '<div><b>'+escapeHtml(t.name)+'</b>'+
      '<div class="artist">'+escapeHtml(t.artists.map(a=>a.name).join(", "))+
      '</div></div>';
    box.appendChild(d);
  });
}

function escapeHtml(s){
  const d=document.createElement("div");
  d.textContent=s;
  return d.innerHTML;
}

function selectAll(){
  document.querySelectorAll(".pick").forEach(x=>x.checked=true);
}

function clearSelection(){
  document.querySelectorAll(".pick").forEach(x=>x.checked=false);
}

async function removeSelected(){
  const chosen=[...document.querySelectorAll(".pick:checked")]
    .map(x=>tracks[Number(x.dataset.i)]);

  if(!chosen.length) return alert("Keine Songs ausgewählt.");

  if(!confirm(chosen.length+" ausgewählte Songs wirklich aus deinen Lieblingssongs entfernen?"))
    return;

  for(let i=0;i<chosen.length;i+=40){
    const uris=chosen.slice(i,i+40).map(t=>t.uri).join(",");
    const r=await fetch(
      "https://api.spotify.com/v1/me/library?uris="+encodeURIComponent(uris),
      {
        method:"DELETE",
        headers:{Authorization:"Bearer "+token}
      }
    );

    if(!r.ok) throw new Error("Entfernen fehlgeschlagen.");
  }

  const removed=new Set(chosen.map(t=>t.uri));
  tracks=tracks.filter(t=>!removed.has(t.uri));
  render();
  alert(chosen.length+" Songs wurden entfernt.");
}

(async()=>{
  const saved=localStorage.getItem("spotify_client_id");
  if(saved) document.getElementById("clientId").value=saved;

  const code=new URLSearchParams(location.search).get("code");
  if(code){
    try{
      await exchangeCode(code);
    }catch(e){
      alert(e.message);
    }
  }
})();
</script>
</body>
</html>
